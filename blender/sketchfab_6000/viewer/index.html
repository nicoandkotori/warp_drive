<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>银河 · 立体星图预览</title>
<style>*{box-sizing:border-box}body{margin:0;background:#04070d;color:#dbe6f5;font:14px system-ui,sans-serif}canvas{display:block;width:100%;height:100vh;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}header{position:absolute;left:32px;top:26px;pointer-events:none}h1{font-size:25px;letter-spacing:5px;font-weight:400;margin:4px 0 10px}.muted{color:#8794aa;font-size:12px;line-height:1.7}.panel{position:absolute;right:24px;top:24px;width:230px;padding:19px;background:#0b1220dc;border:1px solid #293449;border-radius:12px;backdrop-filter:blur(14px)}label{display:block;margin:20px 0 7px}input[type=range]{width:100%;accent-color:#85baff}button,a{background:#152239;border:1px solid #30415b;color:#dceaff;border-radius:6px;padding:8px 11px;text-decoration:none;cursor:pointer}button:hover,a:hover{background:#253956}nav{display:flex;gap:6px;flex-wrap:wrap}footer{position:absolute;bottom:20px;left:30px;font-size:12px;color:#8190a8;max-width:65%}.status{margin-top:16px;font-size:11px;color:#8296b4}.gallery{position:fixed;inset:0;background:#04070df5;display:none;z-index:3;padding:24px;overflow:auto}.gallery.open{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.grid img{width:100%}.close{position:fixed;right:28px;top:20px;z-index:4}.gallery h2{font-size:18px;font-weight:400}.gallery p{color:#8794aa}@media(max-width:650px){header{left:16px;top:16px}h1{font-size:20px}.panel{top:auto;bottom:18px;right:12px;width:190px;padding:12px}label{margin-top:10px}footer{left:16px;bottom:26px;max-width:38%}.grid{grid-template-columns:1fr}}</style></head><body>
<canvas id="space" aria-label="可拖动旋转的三维银河星图" tabindex="0"></canvas>
<header><div class="muted">GALACTIC ATLAS / MODEL STUDY</div><h1>银河 · 星云与尘埃</h1><div class="muted">6,000 颗独立恒星 · 立体体积云层</div></header>
<aside class="panel"><nav><button data-view="oblique">斜视</button><button data-view="top">俯视</button><button data-view="side">侧视</button><button data-view="close">近看纹理</button></nav><label for="cloud">星云亮度 <output id="cv">1.0</output></label><input id="cloud" type="range" min="0" max="2" step=".05" value="1"><label for="star">恒星亮度 <output id="sv">1.0</output></label><input id="star" type="range" min=".2" max="2.5" step=".05" value="1"><label><input id="spin" type="checkbox"> 自动旋转</label><nav><button id="reset">复位</button><button id="photos">高清渲染图</button></nav><div id="status" class="status" role="status">正在加载三维星图…</div></aside>
<footer>拖动旋转 · 滚轮缩放 · 双指缩放<br>新版实时星云 · 独立恒星与三维尘埃。<br>星体模型：caton.laubergiste / CC BY 4.0 · 已修改材质并添加星云</footer>
<section id="gallery" class="gallery"><button class="close" id="close">返回三维星图 ×</button><h2>Blender 高清渲染</h2><p>Blender 前一版静帧；本轮网页密度与配色调整尚未同步到这些图。</p><div class="grid"><figure><img src="reference_01_oblique.png" alt="银河斜视渲染"><figcaption>斜视</figcaption></figure><figure><img src="reference_02_top.png" alt="银河俯视渲染"><figcaption>俯视</figcaption></figure><figure><img src="reference_03_low_angle.png" alt="银河低角度渲染"><figcaption>低角度</figcaption></figure><figure><img src="reference_04_detail.png" alt="银河近景渲染"><figcaption>近景</figcaption></figure></div></section>
<script src="data.js"></script><script src="viewer.js"></script></body></html>
