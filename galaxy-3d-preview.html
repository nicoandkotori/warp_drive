<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>银河 · 新版三维星云</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#dbe6f5;font:14px system-ui,sans-serif}canvas{display:block;width:100%;height:100dvh;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}header{position:absolute;left:28px;top:26px;pointer-events:none}h1{font-size:25px;letter-spacing:3px;font-weight:400;margin:6px 0 12px}.muted{color:#8e9daf;font-size:12px;line-height:1.7}.panel{position:absolute;right:24px;top:24px;width:248px;padding:18px;background:#0b1220df;border:1px solid #293449;border-radius:12px;backdrop-filter:blur(14px)}label{display:block;margin:17px 0 7px}input[type=range]{width:100%;accent-color:#93c9df}button,a,select{font:inherit;background:#152239;border:1px solid #30415b;color:#dceaff;border-radius:6px;padding:8px 11px;text-decoration:none;cursor:pointer}button:hover,a:hover{background:#253956}nav{display:flex;gap:6px;flex-wrap:wrap}footer{position:absolute;bottom:22px;left:28px;font-size:12px;line-height:1.8;color:#8796a9;pointer-events:none}.status{margin-top:16px;font-size:12px;line-height:1.6;color:#a1bacf}#error{color:#ffb4a6}select{width:100%}@media(max-width:650px){header{left:14px;top:16px}h1{font-size:20px}.panel{top:auto;bottom:12px;right:12px;width:210px;padding:12px}label{margin-top:10px}footer{left:14px;bottom:25px;max-width:33%;font-size:10px}}
</style></head><body>
<canvas id="space" aria-label="拖动旋转、滚轮缩放的新版三维银河" tabindex="0"></canvas>
<header><div class="muted">GALACTIC ATLAS / REFINED VOLUME</div><h1>银河 · 星云与尘埃</h1><div class="muted">新版多尺度星云 · 暗尘埃裂缝 · 细密微星</div></header>
<aside class="panel"><nav><button data-view="oblique">斜视</button><button data-view="top">俯视</button><button data-view="side">侧视</button><button data-view="close">近看纹理</button><button data-view="inside">太阳邻域</button></nav>
<label for="cloud">星云亮度 <output id="cv">1.0</output></label><input id="cloud" type="range" min="0" max="2" step=".05" value="1">
<label for="star">恒星亮度 <output id="sv">1.0</output></label><input id="star" type="range" min="0" max="2" step=".05" value="1">
<label for="quality">画质</label><select id="quality"><option value="1080" selected>高清 · 最高 1080p</option><option value="720">流畅 · 最高 720p</option></select>
<label><input id="spin" type="checkbox"> 自动旋转</label><nav><button id="reset">复位</button><a href="galaxy-refine-preview.html" target="_blank">成片对比</a></nav><div id="status" class="status" role="status">正在加载新版星云…</div><div id="error" role="alert"></div></aside>
<footer>拖动旋转 · 滚轮 / 双指缩放<br>方向键转动 · ＋ / －缩放<br>caton.laubergiste / CC BY 4.0<br>已修改材质并添加星云</footer>
<script src="galaxy-3d-preview.js"></script></body></html>
